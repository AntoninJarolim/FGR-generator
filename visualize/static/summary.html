<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGR span-extraction performance</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #dcdfe4; --text: #1c2128;
    --muted: #6b7280; --accent: #2563eb; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 40px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  header a.home { text-decoration: none; font-size: 18px; color: var(--muted); }
  header a.home:hover { color: var(--accent); }
  header h1 { font-size: 15px; margin: 0; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 4px 0 22px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px 16px; margin-bottom: 22px; }
  section h2 { margin: 0 0 10px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr.baseline { color: var(--muted); font-style: italic; }
  tbody tr.baseline td:first-child { font-style: normal; }
  td.na { color: var(--muted); }
  .loading { color: var(--muted); padding: 10px 0; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <a class="home" href="/" title="dashboard">⌂</a>
  <h1>FGR-SPAN-EXTRACTION-PERFORMANCE — evaluation results per subset</h1>
</header>
<main>
  <div id="note" class="note">loading…</div>
  <div id="content"><div class="loading">loading results…</div></div>
</main>

<script>
"use strict";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Raw fractions from the API; multiply by 100 for display, matching the CLI
// table (eval/summary_table.py). "—" whenever a metric has not been run.
const cell = v => v == null ? '<td class="na">—</td>' : `<td>${(v * 100).toFixed(1)}</td>`;

async function main() {
  const content = document.getElementById("content");
  const noteEl = document.getElementById("note");
  let data;
  try {
    data = await (await fetch("/api/summary")).json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    noteEl.textContent = "";
    content.innerHTML = `<div class="err">failed to load results: ${esc(e.message)}</div>`;
    return;
  }
  noteEl.textContent = data.note;
  content.innerHTML = data.tables.map(t => renderTable(t, data.columns)).join("");
}

function renderTable(table, columns) {
  const head = `<th>system</th>` + columns.map(c => `<th>${esc(c)}</th>`).join("");
  const rows = table.rows.map(r => {
    const cls = r.system.startsWith("baseline:") ? ' class="baseline"' : "";
    const cells = columns.map(c => cell(r.cells[c])).join("");
    return `<tr${cls}><td>${esc(r.system)}</td>${cells}</tr>`;
  }).join("");
  return `<section>
    <h2>${esc(table.title)}</h2>
    <table>
      <thead><tr>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

main();
</script>
</body>
</html>
