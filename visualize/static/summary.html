<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FGR span-extraction performance</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #dcdfe4; --text: #1c2128;
    --muted: #6b7280; --accent: #2563eb; --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 40px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  header a.home { text-decoration: none; font-size: 18px; color: var(--muted); }
  header a.home:hover { color: var(--accent); }
  header h1 { font-size: 15px; margin: 0; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 4px 0 22px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px 16px; margin-bottom: 22px; }
  section h2 { margin: 0 0 10px; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #eef0f3; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr.baseline { color: var(--muted); font-style: italic; }
  tbody tr.baseline td:first-child { font-style: normal; }
  td.na { color: var(--muted); }
  .loading { color: var(--muted); padding: 10px 0; }
  .err { color: var(--bad); }
  .ci { color: var(--muted); font-size: 11.5px; }
  td.diag { color: var(--border); }
  td.win { background: #eaf3ea; }
  td.loss { background: #fbecec; }
  .method { background: #f8f9fb; border-left: 3px solid var(--accent);
    padding: 10px 12px; margin-top: 14px; font-size: 12.5px; color: #333; }
  .method b { color: var(--text); }
  .method p { margin: 0 0 8px; }
  .method p:last-child { margin-bottom: 0; }
  .rel { font-size: 12.5px; color: var(--muted); margin: 2px 0 12px; }
  .rel b { color: var(--text); font-weight: 600; }
  h2.figs-title { font-size: 16px; margin: 30px 0 2px; }
  .figs-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  #figframe { width: 100%; border: 0; height: 480px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; }
</style>
</head>
<body>
<header>
  <a class="home" href="." title="dashboard">⌂</a>
  <h1>FGR-SPAN-EXTRACTION-PERFORMANCE — evaluation results per subset</h1>
</header>
<main>
  <div id="note" class="note">loading…</div>
  <div id="content"><div class="loading">loading results…</div></div>

  <h2 class="figs-title">Figures</h2>
  <div class="figs-sub">plausibility (x) vs answer-bearing (y) per model and prompt format —
     top-right is best.</div>
  <!-- Mount-relative like the fetch() calls below, so it resolves under a
       reverse-proxy subpath instead of the server root. -->
  <iframe id="figframe" title="span-extraction figures" src="api/summary_plot"></iframe>
</main>

<script>
"use strict";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Raw fractions from the API; multiply by 100 for display, matching the CLI
// table (eval/summary_table.py). "—" whenever a metric has not been run.
const cell = v => v == null ? '<td class="na">—</td>' : `<td>${(v * 100).toFixed(1)}</td>`;

async function main() {
  const content = document.getElementById("content");
  const noteEl = document.getElementById("note");
  let data;
  try {
    data = await (await fetch("api/summary")).json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    noteEl.textContent = "";
    content.innerHTML = `<div class="err">failed to load results: ${esc(e.message)}</div>`;
    return;
  }
  noteEl.textContent = data.note;
  content.innerHTML = data.tables.map(t => renderTable(t, data.columns)).join("")
    + (data.judge ? renderJudge(data.judge) : "");
}

// ---- judged-preference panel -------------------------------------------------
const pc = v => v == null ? "—" : (v * 100).toFixed(1);
const withCi = (v, lo, hi) => v == null ? '<td class="na">—</td>'
  : `<td>${pc(v)}<span class="ci"> [${pc(lo)}, ${pc(hi)}]</span></td>`;

function renderJudge(j) {
  const sys = j.systems || [];
  // Per-system rates. Ordered by the leaderboard figure so the panel reads as a
  // ranking rather than as configuration order.
  const rows = sys.map(s => {
    const per = firstSubset(j.runs[j.system_ids[s]]);
    if (!per) return null;
    return { s, per };
  }).filter(Boolean).sort((a, b) => (b.per.bt_winrate || 0) - (a.per.bt_winrate || 0));

  const rateRows = rows.map(({ s, per }) => `<tr>
      <td>${esc(s)}</td>
      ${withCi(per.bt_winrate, per.bt_ci_low, per.bt_ci_high)}
      ${withCi(per.plausible_rate, per.plausible_ci_low, per.plausible_ci_high)}
      ${withCi(per.minimality_winrate, per.minimality_ci_low, per.minimality_ci_high)}
    </tr>`).join("");

  // Win matrix: row beats column, decisive comparisons only.
  const order = rows.map(r => r.s);
  const mhead = `<th>beats →</th>` + order.map(s => `<th>${esc(short(s))}</th>`).join("");
  const mrows = order.map(a => {
    const cells = order.map(b => {
      if (a === b) return '<td class="diag">·</td>';
      const c = j.matrix[`${a}|${b}`];
      if (!c) return '<td class="na">—</td>';
      const cls = c.win_rate > 0.5 ? "win" : "loss";
      return `<td class="${cls}">${pc(c.win_rate)}<span class="ci"> ±${
        pc((c.ci_high - c.ci_low) / 2)}</span></td>`;
    }).join("");
    return `<tr><td>${esc(a)}</td>${cells}</tr>`;
  }).join("");

  const sc = j.self_consistency;
  const rel = [
    `judge <b>${esc(j.judge_model || "?")}</b>`,
    `<b>${j.n_judged}</b> comparisons judged, <b>${j.n_resolved}</b> resolved without a call`,
    `judge tie rate <b>${pc(j.tie_rate_judge)}%</b>`,
    `both-bad <b>${pc(j.both_bad_rate)}%</b>`,
    `intransitive triads <b>${(j.intransitive_triads || []).length}</b>`,
    j.flip_rate == null ? `position-bias flip rate <b>not measured</b>`
      : `flip rate <b>${pc(j.flip_rate)}%</b> (n=${j.flip_n})`,
    sc ? `self-consistency <b>${pc(sc.rate)}%</b> (${sc.identical}/${sc.n} re-scored)` : null,
  ].filter(Boolean).join(" · ");

  const agree = Object.entries(j.agreement || {}).map(([m, a]) =>
    `<p><b>Agreement with ${esc(m)}:</b> ${pc(a.raw_agreement)}% raw, κ=${
      a.kappa.toFixed(3)}, on ${a.n} shared comparisons.</p>`).join("");

  return `<section>
    <h2>Judged preference — blind pairwise, all-vs-all</h2>
    <div class="rel">${rel}</div>
    <table>
      <thead><tr><th>system</th><th>BT share</th><th>plausible</th><th>minimality</th></tr></thead>
      <tbody>${rateRows}</tbody>
    </table>
    <h2 style="margin-top:18px">Win matrix — row beats column</h2>
    <div class="rel">decisive comparisons only (ties excluded); ± is the half-width
      of the 95% interval</div>
    <table>
      <thead><tr>${mhead}</tr></thead>
      <tbody>${mrows}</tbody>
    </table>
    <div class="method">
      ${agree}
      <p><b>Rate intervals (BT share, plausible, minimality, matrix cells):</b>
        ${esc((j.ci_method||{}).rates || "")}</p>
      <p><b>Bradley–Terry interval:</b> ${esc((j.ci_method||{}).bt || "")}</p>
    </div>
  </section>`;
}

// runs[] is keyed by subset but the judge fit is pooled, so every subset holds
// the same values; take whichever is present.
function firstSubset(bySubset) {
  if (!bySubset) return null;
  const k = Object.keys(bySubset)[0];
  return k ? bySubset[k] : null;
}
const short = s => s.replace("gemma31B-", "g31-").replace("-unc", "-u")
  .replace("-con", "-c").replace("-reas", "-r");

function renderTable(table, columns) {
  const head = `<th>system</th>` + columns.map(c => `<th>${esc(c)}</th>`).join("");
  const rows = table.rows.map(r => {
    const cls = r.system.startsWith("baseline:") ? ' class="baseline"' : "";
    const cells = columns.map(c => cell(r.cells[c])).join("");
    return `<tr${cls}><td>${esc(r.system)}</td>${cells}</tr>`;
  }).join("");
  return `<section>
    <h2>${esc(table.title)}</h2>
    <table>
      <thead><tr>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

// The Bokeh document is served same-origin, so grow the iframe to fit its
// content. BokehJS lays out asynchronously after load, so poll briefly.
function fitFrame() {
  const fr = document.getElementById("figframe");
  try {
    const h = fr.contentWindow.document.body.scrollHeight;
    if (h > 60) fr.style.height = (h + 24) + "px";
  } catch (e) { /* not loaded yet */ }
}
document.getElementById("figframe").addEventListener("load", () => {
  let n = 0;
  const id = setInterval(() => { fitFrame(); if (++n > 16) clearInterval(id); }, 250);
});

main();
</script>
</body>
</html>
